# A constructed headscale configuration serving its own certificate, the way
# an operator sets it up with a pair tui-cert installed for the service. Every
# host is a documentation name.
server_url: https://vpn.example.com
listen_addr: 0.0.0.0:443

tls_letsencrypt_hostname: ""
tls_cert_path: /etc/headscale/tls/vpn.example.com.crt
tls_key_path: /etc/headscale/tls/vpn.example.com.key

noise:
  private_key_path: /var/lib/headscale/noise_private.key

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite

dns:
  magic_dns: true
  base_domain: tailnet.example.net
