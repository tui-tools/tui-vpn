# A constructed headscale configuration that keeps its data in PostgreSQL:
# the database is some other server's file, so only the noise key is state
# on this machine. Every host is a documentation name.
server_url: https://vpn.example.com
listen_addr: 0.0.0.0:8080

noise:
  private_key_path: /var/lib/headscale/noise_private.key

database:
  type: postgres
  postgres:
    host: db.example.com
    port: 5432
    name: headscale
    user: headscale
